{% extends "polos.html" %}
{% block judul %}Buat password{% endblock %}
{% block isi %}
<h1 style="font-size:22px">Buat password</h1>
<p class="muted" style="margin:0">Password ini dipakai setiap kali membuka aplikasi, dari laptop maupun HP. Minimal {{ minimal }} karakter.</p>
<form method="post" style="display:flex;flex-direction:column;gap:14px">
  <label class="isian">Password baru
    <input class="field" type="password" name="password" autocomplete="new-password" minlength="{{ minimal }}" required autofocus>
  </label>
  <label class="isian">Ulangi password
    <input class="field" type="password" name="konfirmasi" autocomplete="new-password" minlength="{{ minimal }}" required>
  </label>
  <button class="btn btn-utama btn-besar" type="submit">Simpan &amp; masuk</button>
</form>
{% endblock %}
