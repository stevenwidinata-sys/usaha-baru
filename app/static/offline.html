<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tidak ada internet</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
           box-sizing: border-box; background: #F4F5F2; color: #1A1F1C;
           font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; text-align: center; }
    main { max-width: 360px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
    img { width: 72px; height: 72px; }
    h1 { margin: 0; font-size: 22px; }
    p { margin: 0; color: #5B635E; line-height: 1.5; }
    button { min-height: 48px; padding: 0 24px; border: 0; border-radius: 10px; background: #0B6B4F; color: #fff;
             font: inherit; font-weight: 700; font-size: 15px; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <img src="/static/ikon/ikon-192.png" alt="">
    <h1>Tidak ada internet</h1>
    <p>Aplikasi butuh koneksi internet untuk membuka dan menyimpan data. Periksa sinyal atau WiFi, lalu coba lagi.</p>
    <button type="button" onclick="location.reload()">Coba lagi</button>
  </main>
</body>
</html>
